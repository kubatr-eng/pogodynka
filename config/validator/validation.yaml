App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  message: 'Podaj nazwę miasta.'
                  groups: ['new', 'edit']
            - Length:
                  min: 3
                  max: 255
                  groups: ['new']
            - Length:
                  min: 2
                  max: 255
                  groups: ['edit']

        country:
            - NotBlank:
                  message: 'Wybierz państwo.'
                  groups: ['new', 'edit']
            - Choice:
                  choices: ['PL', 'DE', 'RO', 'IE', 'FR', 'SE', 'NO']
                  groups: ['new', 'edit']

        latitude:
            - NotBlank:
                  message: 'Podaj szerokość geograficzną.'
                  groups: ['new', 'edit']
            - Range:
                  min: -90
                  max: 90
                  groups: ['new', 'edit']

        longitude:
            - NotBlank:
                  message: 'Podaj długość geograficzną.'
                  groups: ['new', 'edit']
            - Range:
                  min: -180
                  max: 180
                  groups: ['new', 'edit']


App\Entity\Measurement:
    properties:
        location:
            - NotNull:
                  message: 'Wybierz lokalizację.'
                  groups: ['new', 'edit']

        date:
            - NotNull:
                  message: 'Podaj datę prognozy.'
                  groups: ['new', 'edit']

        celsius:
            - NotBlank:
                  message: 'Podaj temperaturę.'
                  groups: ['new', 'edit']
            - Range:
                  min: -90
                  max: 60
                  notInRangeMessage: 'Wartośc temperatury musi leżeć w granicach -90 a 60°C.'
                  groups: ['new', 'edit']
