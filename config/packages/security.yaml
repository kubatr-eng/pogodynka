security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto' #'plaintext'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory:
            memory:
                users:
                    admin:
                        password: '$2y$13$GVtzcQUWYQqyhG4F1Mzpl.VbJ3bgl0fboAFEM2UfRo8RFPMUNEgta'
                        roles:
                            - 'ROLE_ADMIN'
                            - 'ROLE_USER'
                    user:
                        password: '$2y$13$GVtzcQUWYQqyhG4F1Mzpl.VbJ3bgl0fboAFEM2UfRo8RFPMUNEgta'
                        roles:
                            - 'ROLE_USER'

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: app_login
                check_path: app_login
            logout:
                path: app_logout

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/, roles: PUBLIC_ACCESS }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

    role_hierarchy:
        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_LOCATION_NEW
            - ROLE_LOCATION_EDIT
            - ROLE_LOCATION_DELETE
            - ROLE_MEASUREMENT_NEW
            - ROLE_MEASUREMENT_EDIT
            - ROLE_MEASUREMENT_DELETE

        ROLE_USER:
            - ROLE_LOCATION_INDEX
            - ROLE_LOCATION_SHOW
            - ROLE_MEASUREMENT_INDEX
            - ROLE_MEASUREMENT_SHOW

